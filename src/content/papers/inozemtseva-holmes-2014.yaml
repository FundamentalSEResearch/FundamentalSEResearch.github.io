title: Coverage Is Not Strongly Correlated with Test Suite Effectiveness
authors: ["Inozemtseva, L.", "Holmes, R."]
year: 2014
venue: ICSE 2014
type: conference
doi: 10.1145/2568225.2568271
evidence:
  - question: does-coverage-measure-test-quality
    law: coverage-effectiveness
    relation: tests
    finding: refutes
    methods: [controlled-experiment]
    context: { setting: open-source, participants: none, domain: software }
    note: Generating 31,000 test suites for five large Java systems and measuring effectiveness by mutation analysis, found only a low to moderate correlation between coverage and effectiveness once the number of tests was controlled for, and concluded coverage should not be used as a quality target.
