title: "From Origami to Software Development: A Review of Studies on Judgment-Based Predictions of Performance Time"
authors: ["Halkjelsvik, T.", "Jørgensen, M."]
year: 2012
venue: Psychological Bulletin 138(2)
type: journal
doi: 10.1037/a0025996
evidence:
  - question: why-estimates-are-optimistic
