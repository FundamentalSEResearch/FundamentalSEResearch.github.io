title: "To Type or Not to Type: Quantifying Detectable Bugs in JavaScript"
authors: ["Gao, Z.", "Bird, C.", "Barr, E. T."]
year: 2017
venue: ICSE 2017
type: conference
doi: 10.1109/ICSE.2017.75
evidence:
  - question: does-language-affect-defects
    law: programming-language-defect-effect
