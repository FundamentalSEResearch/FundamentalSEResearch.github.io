title: An Exploratory Study of the Impact of Antipatterns on Class Change- and Fault-Proneness
authors: ["Khomh, F.", "Di Penta, M.", "Guéhéneuc, Y.-G.", "Antoniol, G."]
year: 2012
venue: Empirical Software Engineering 17(3)
type: journal
doi: 10.1007/s10664-011-9171-y
evidence:
  - question: do-code-smells-harm-maintainability
    law: code-smell-hypothesis
    relation: tests
    finding: supports
    methods: [mining-software-repositories]
    context: { setting: open-source, participants: mixed, domain: software }
    propositions: [change-proneness, fault-proneness]
    note: Across 54 releases of ArgoUML, Eclipse, Mylyn, and Rhino, classes participating in antipatterns were more change- and fault-prone than other classes in almost all releases, and size alone did not explain the difference.
