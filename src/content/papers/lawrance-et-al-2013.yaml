title: "How Programmers Debug, Revisited: An Information Foraging Theory Perspective"
authors: ["Lawrance, J.", "Bogart, C.", "Burnett, M.", "Bellamy, R.", "Rector, K.", "Fleming, S. D."]
year: 2013
venue: IEEE Transactions on Software Engineering 39(2)
type: journal
doi: 10.1109/TSE.2010.111
evidence:
  - question: how-developers-navigate-code
    theory: information-foraging-theory
    relation: modifies
    finding: supports
    methods: [case-study, simulation]
    context: { setting: laboratory, participants: professionals, domain: software }
    propositions: [scent-guides-navigation, scent-predicts]
    note: Adapted the theory to debugging; ten professional programmers debugging a real open source program talked far more about following scent than about hypotheses, and an executable model based on scent and topology predicted their navigation better than models without scent.
  - question: how-developers-comprehend-code
    theory: top-down-program-comprehension
    relation: tests
    finding: refutes
    methods: [case-study]
    context: { setting: laboratory, participants: professionals, domain: software }
    propositions: [hypothesis-driven]
    note: Professional programmers' verbalizations while debugging concerned following cues in the code far more often than forming or testing hypotheses, which counts against hypothesis-driven comprehension in debugging tasks.
