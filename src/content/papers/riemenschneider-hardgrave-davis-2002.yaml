title: "Explaining Software Developer Acceptance of Methodologies: A Comparison of Five Theoretical Models"
authors: ["Riemenschneider, C. K.", "Hardgrave, B. C.", "Davis, F. D."]
year: 2002
venue: IEEE Transactions on Software Engineering 28(12)
type: journal
doi: 10.1109/TSE.2002.1158287
evidence:
  - question: why-developers-adopt-methods
