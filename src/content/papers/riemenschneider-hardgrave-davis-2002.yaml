    context: { setting: industrial, participants: professionals, domain: software }
    propositions: [usefulness-intention]
    note: In a field study of 128 developers in an organization introducing a methodology, perceived usefulness mattered, but intentions were driven largely by factors outside core TAM, namely an organizational mandate, compatibility with how developers work, and the opinions of coworkers and supervisors; no single model captured all the key determinants.
