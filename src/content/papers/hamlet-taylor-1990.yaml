title: Partition Testing Does Not Inspire Confidence
authors: ["Hamlet, D.", "Taylor, R."]
year: 1990
venue: IEEE Transactions on Software Engineering 16(12)
type: journal
doi: 10.1109/32.62448
evidence:
  - question: is-systematic-testing-better-than-random
