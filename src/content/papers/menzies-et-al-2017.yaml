title: "Are Delayed Issues Harder to Resolve? Revisiting Cost-to-Fix of Defects throughout the Lifecycle"
authors: ["Menzies, T.", "Nichols, W.", "Shull, F.", "Layman, L."]
year: 2017
venue: Empirical Software Engineering 22(4)
type: journal
doi: 10.1007/s10664-016-9469-x
evidence:
  - question: do-defects-cost-more-later
    law: defect-cost-escalation
    relation: tests
    finding: refutes
    methods: [mining-software-repositories]
    context: { setting: industrial, participants: professionals, domain: software }
    note: In effort data from 171 projects run between 2006 and 2014 with a disciplined, phase-based process, issues resolved in later phases did not take consistently or substantially more effort, suggesting the escalation effect is not universal.
