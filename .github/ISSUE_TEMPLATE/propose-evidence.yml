name: Propose evidence
description: Suggest a paper that tests, applies, reviews, modifies, or compares a law or theory on a question
labels: [evidence]
body:
  - type: input
    id: doi
    attributes:
      label: DOI or stable URL
      placeholder: 10.1109/TSE.2003.1205177
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: Which question does it address?
      description: An existing question id, or describe a new one.
    validations:
      required: true
  - type: input
    id: theory
    attributes:
      label: Which law or theory does it address?
      description: If the claim has several propositions, say which ones the paper addresses.
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: How does the paper use it?
      options:
        - tests (tests it empirically)
        - applies (applies it and observes the outcome)
        - reviews (synthesizes other studies)
        - modifies (refines or extends it)
        - compares (tests it against a rival)
        - post-hoc (explains results after the fact)
        - proposes (first proposes it)
    validations:
      required: true
  - type: input
    id: rival
    attributes:
      label: Rival law or theory (only for comparisons)
  - type: input
    id: context
    attributes:
      label: Context
      description: Setting (industrial, open source, lab, simulation), participants (professionals, students), and whether the study is about software.
  - type: dropdown
    id: finding
    attributes:
      label: Finding
      options: [supports, mixed, refutes, n/a (proposes or post-hoc)]
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: What did the paper find? (1–2 sentences, in your own words)
    validations:
      required: true
